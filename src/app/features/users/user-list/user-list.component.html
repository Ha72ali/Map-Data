<div class="header">
  <h1 class="page-title">User Management</h1>
  <a mat-raised-button color="primary" routerLink="/admin/users/new" *appHasPermission="'User.Create'">
    <mat-icon>add</mat-icon> Add User
  </a>
</div>

<div class="filters">
  <mat-form-field appearance="outline" class="f-search">
    <mat-label>Search</mat-label>
    <input matInput [(ngModel)]="query.search" (keyup.enter)="applyFilters()" placeholder="name, email, username" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="f-select">
    <mat-label>Role</mat-label>
    <mat-select [(ngModel)]="query.role" (selectionChange)="applyFilters()">
      <mat-option value="">All roles</mat-option>
      <mat-option *ngFor="let r of roles()" [value]="r.id">{{ r.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="f-select">
    <mat-label>Status</mat-label>
    <mat-select [(ngModel)]="query.status" (selectionChange)="applyFilters()">
      <mat-option value="">All</mat-option>
      <mat-option value="active">Active</mat-option>
      <mat-option value="inactive">Inactive</mat-option>
      <mat-option value="pending">Pending</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-flat-button color="primary" class="f-apply" (click)="applyFilters()">
    <mat-icon>filter_list</mat-icon> Apply
  </button>
</div>

<div class="table-card">
  <table mat-table [dataSource]="users()" matSort (matSortChange)="onSort($event)" class="full-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="firstName">Name</th>
      <td mat-cell *matCellDef="let u">{{ u.firstName }} {{ u.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="username">Username</th>
      <td mat-cell *matCellDef="let u">{{ u.username }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="email">Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u">{{ u.role?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let u">
        <mat-chip [class.active-chip]="u.isActive" [class.inactive-chip]="!u.isActive">
          {{ u.status }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let u">
        <a mat-icon-button [routerLink]="['/admin/users', u.id, 'edit']" *appHasPermission="'User.Edit'" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </a>
        <button
          mat-icon-button
          (click)="toggleStatus(u)"
          *appHasPermission="['User.Active', 'User.Deactive']"
          [matTooltip]="u.isActive ? 'Deactivate' : 'Activate'"
        >
          <mat-icon>{{ u.isActive ? 'toggle_on' : 'toggle_off' }}</mat-icon>
        </button>
        <button mat-icon-button (click)="resetPassword(u)" *appHasPermission="'User.Edit'" matTooltip="Reset password">
          <mat-icon>lock_reset</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="remove(u)" *appHasPermission="'User.Delete'" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <p class="empty" *ngIf="users().length === 0">No users found.</p>

  <mat-paginator
    [length]="total()"
    [pageSize]="query.limit || 10"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="onPage($event)"
  ></mat-paginator>
</div>
