<div class="auth-shell auth-solo">
  <main class="auth-panel">
    <div class="auth-card">
      <div class="auth-progress"><mat-progress-bar *ngIf="submitting()" mode="indeterminate"></mat-progress-bar></div>

      <div class="auth-head">
        <div class="auth-badge"><mat-icon>password</mat-icon></div>
        <h2>Reset password</h2>
        <p>Choose a new password</p>
      </div>

      <p class="auth-hint" *ngIf="!token()" style="color:#c0392b; font-size:13px">
        No reset token found in the link.
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>New Password</mat-label>
          <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
          <mat-error *ngIf="form.controls.newPassword.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">Minimum 6 characters</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
          <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
        </mat-form-field>
        <button mat-flat-button color="primary" class="full submit-btn" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>

      <div class="auth-hint"><a routerLink="/login">← Back to sign in</a></div>
    </div>
  </main>
</div>
