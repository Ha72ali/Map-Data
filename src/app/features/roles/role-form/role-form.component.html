<h1 class="page-title">{{ isEdit() ? 'Edit Role' : 'Create Role' }}</h1>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-card class="card">
    <mat-card-content>
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Role Name</mat-label>
          <input matInput formControlName="name" />
          <mat-error *ngIf="form.controls.name.hasError('required')">Required</mat-error>
        </mat-form-field>
        <mat-slide-toggle formControlName="isActive">Enabled</mat-slide-toggle>
      </div>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <mat-card class="card matrix">
    <mat-card-header><mat-card-title>Permissions</mat-card-title></mat-card-header>
    <mat-card-content>
      <div class="group" *ngFor="let g of groups()">
        <mat-checkbox
          [checked]="groupAllChecked(g)"
          [indeterminate]="groupSomeChecked(g)"
          (change)="toggleGroup(g, $event.checked)"
          class="group-head"
        >
          {{ g.group }}
        </mat-checkbox>
        <div class="perms">
          <mat-checkbox
            *ngFor="let p of g.permissions"
            [checked]="isChecked(p.key)"
            (change)="toggle(p.key, $event.checked)"
            [matTooltip]="p.description"
          >
            {{ p.key }}
          </mat-checkbox>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="actions">
    <a mat-button routerLink="/admin/roles">Cancel</a>
    <button mat-raised-button color="primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving…' : isEdit() ? 'Update Role' : 'Create Role' }}
    </button>
  </div>
</form>
