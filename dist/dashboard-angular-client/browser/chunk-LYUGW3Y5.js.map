<div class="header">
  <h1 class="page-title">Role Management</h1>
  <a mat-raised-button color="primary" routerLink="/admin/roles/new">
    <mat-icon>add</mat-icon> Create Role
  </a>
</div>

<div class="table-card">
  <table mat-table [dataSource]="roles()" class="full-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let r">
        {{ r.name }}
        <mat-icon *ngIf="protectedRoles.includes(r.name)" class="lock" matTooltip="Protected system role">lock</mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let r">{{ r.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="permissions">
      <th mat-header-cell *matHeaderCellDef>Permissions</th>
      <td mat-cell *matCellDef="let r"><mat-chip>{{ r.permissions.length }}</mat-chip></td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let r">
        <mat-chip [class.active-chip]="r.isActive" [class.inactive-chip]="!r.isActive">
          {{ r.isActive ? 'enabled' : 'disabled' }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button [routerLink]="['/admin/roles', r.id, 'edit']" matTooltip="Edit / permissions">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button (click)="toggleActive(r)" [matTooltip]="r.isActive ? 'Disable' : 'Enable'">
          <mat-icon>{{ r.isActive ? 'toggle_on' : 'toggle_off' }}</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="remove(r)"
          [disabled]="protectedRoles.includes(r.name)"
          matTooltip="Delete"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
