<h1 class="page-title">Change Password</h1>

<mat-card class="card">
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Current Password</mat-label>
        <input matInput type="password" formControlName="currentPassword" autocomplete="current-password" />
        <mat-error *ngIf="form.controls.currentPassword.hasError('required')">Required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>New Password</mat-label>
        <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
        <mat-error *ngIf="form.controls.newPassword.hasError('required')">Required</mat-error>
        <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">Minimum 6 characters</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Confirm New Password</mat-label>
        <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Update Password' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
