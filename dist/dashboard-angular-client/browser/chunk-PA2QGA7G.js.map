<h1 class="page-title">{{ isEdit() ? 'Edit User' : 'Add User' }}</h1>

<mat-card class="card">
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" />
          <mat-error *ngIf="form.controls.firstName.hasError('required')">Required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" />
          <mat-error *ngIf="form.controls.username.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.controls.username.hasError('minlength')">Min 3 chars</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" [readonly]="isEdit()" />
          <mat-error *ngIf="form.controls.email.hasError('email')">Invalid email</mat-error>
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>{{ isEdit() ? 'New Password (optional)' : 'Password' }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-error *ngIf="form.controls.password.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.controls.password.hasError('minlength')">Min 6 chars</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option *ngFor="let r of roles()" [value]="r.id">{{ r.name }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.role.hasError('required')">Required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option value="active">Active</mat-option>
            <mat-option value="inactive">Inactive</mat-option>
            <mat-option value="pending">Pending</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="actions">
        <a mat-button routerLink="/admin/users">Cancel</a>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : isEdit() ? 'Update User' : 'Create User' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
