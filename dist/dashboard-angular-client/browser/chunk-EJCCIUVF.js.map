<div class="auth-shell auth-solo">
  <main class="auth-panel">
    <div class="auth-card">
      <div class="auth-progress"><mat-progress-bar *ngIf="submitting()" mode="indeterminate"></mat-progress-bar></div>

      <div class="auth-head">
        <div class="auth-badge"><mat-icon>lock_reset</mat-icon></div>
        <h2>Forgot password</h2>
        <p>We'll email you a reset link</p>
      </div>

      <ng-container *ngIf="!sent(); else doneTpl">
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="form.controls.email.hasError('required')">Required</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Invalid email</mat-error>
          </mat-form-field>
          <button mat-flat-button color="primary" class="full submit-btn" type="submit" [disabled]="submitting()">
            {{ submitting() ? 'Sending…' : 'Send reset link' }}
          </button>
        </form>
      </ng-container>
      <ng-template #doneTpl>
        <p class="auth-hint" style="font-size:13.5px">
          If an account exists for that email, a reset link has been sent. In dev, the link is printed in the server log.
        </p>
      </ng-template>

      <div class="auth-hint"><a routerLink="/login">← Back to sign in</a></div>
    </div>
  </main>
</div>
